<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rizwan Dictionary · رضوان ډکشنري</title>
<style>
:root{--bg:#f6f1e6;--card:#fffdf8;--tx:#22201a;--mut:#756f60;--ac:#0f5a40;--gold:#b8892b;--bd:#e6dcc4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--card:#17201b;--tx:#efeadc;--mut:#a39d8b;--ac:#58c79a;--gold:#e0b552;--bd:#2a362f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1512;--card:#17201b;--tx:#efeadc;--mut:#a39d8b;--ac:#58c79a;--gold:#e0b552;--bd:#2a362f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Georgia,"Times New Roman",serif}
header{background:linear-gradient(135deg,#0b3d2c,#0f5a40 60%,#14704f);color:#fff;text-align:center;padding:26px 16px 22px;border-bottom:3px solid var(--gold)}
.fa{font:700 38px/1.3 "Noto Nastaliq Urdu","Noto Naskh Arabic",Tahoma,serif;color:#f3d98b;margin:0}
.fe{letter-spacing:.3em;text-transform:uppercase;font-size:13px;margin:4px 0 0;color:#e8f3ed}
.orn{color:var(--gold);font-size:14px;letter-spacing:.5em;margin-top:8px}
main{max-width:680px;margin:0 auto;padding:16px}
.bar{display:flex;gap:8px;margin-bottom:10px}
input{flex:1;min-width:0;padding:13px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:16px system-ui,sans-serif}
button{font:inherit;cursor:pointer}
.dir{padding:0 14px;border:1px solid var(--gold);border-radius:12px;background:var(--card);color:var(--ac);font:600 14px system-ui,sans-serif;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{flex:none;padding:7px 13px;border:1px solid var(--bd);border-radius:999px;background:var(--card);color:var(--tx);font:14px system-ui,sans-serif}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.cnt{font:13px system-ui,sans-serif;color:var(--mut);margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--gold);border-radius:14px;padding:13px 15px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.en{font-size:19px;font-weight:700}
.ps{font:26px/1.5 "Noto Naskh Arabic","Scheherazade New",Tahoma,serif;direction:rtl;text-align:right;color:var(--ac)}
.pr{font:italic 14px system-ui,sans-serif;color:var(--gold)}
.tag{font:11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.spk{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--ac);font-size:17px}
.ex{margin-top:10px;padding-top:9px;border-top:1px dashed var(--bd)}
.ex .e{font-size:15px;color:var(--mut)}
.ex .p{font:19px/1.6 "Noto Naskh Arabic",Tahoma,serif;direction:rtl;text-align:right}
.note{font:13px system-ui,sans-serif;color:var(--mut);margin-top:14px}

}
